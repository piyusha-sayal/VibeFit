<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VibeFit — Mobile UI v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; background:#080604; }
    ::-webkit-scrollbar { display:none; }
    * { scrollbar-width:none; }

    @keyframes ringPulse {
      0% { transform:scale(1); opacity:.55; }
      100% { transform:scale(1.55); opacity:0; }
    }
    @keyframes scanLine {
      0%,100% { transform:translateY(-80px); opacity:.8; }
      50%     { transform:translateY(80px);  opacity:.3; }
    }
    @keyframes breathe {
      0%,100% { opacity:.35; }
      50%     { opacity:.7; }
    }
    @keyframes typeDot {
      0%,80%,100% { transform:translateY(0);  opacity:.35; }
      40%         { transform:translateY(-5px); opacity:1; }
    }
    @keyframes shimmer {
      from { background-position:-200% center; }
      to   { background-position: 200% center; }
    }
    @keyframes softFloat {
      0%,100% { transform:translateY(0); }
      50%     { transform:translateY(-4px); }
    }
    .ring-1 { animation: ringPulse 2.4s ease-out infinite; }
    .ring-2 { animation: ringPulse 2.4s ease-out .8s infinite; }
    .ring-3 { animation: ringPulse 2.4s ease-out 1.6s infinite; }
    .scan-line { animation: scanLine 2.2s ease-in-out infinite; }
    .breathe { animation: breathe 3s ease-in-out infinite; }
    .float { animation: softFloat 4s ease-in-out infinite; }
    .dot-1 { animation: typeDot 1.4s ease-in-out infinite; }
    .dot-2 { animation: typeDot 1.4s ease-in-out .2s infinite; }
    .dot-3 { animation: typeDot 1.4s ease-in-out .4s infinite; }
    .gold-shimmer {
      background: linear-gradient(90deg,#c9a87c,#f0dcb0,#c9a87c,#a87d4c,#c9a87c);
      background-size:250% auto;
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      animation: shimmer 4s linear infinite;
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

    <circle cx="15" cy="20" r="2.5" fill={color} fillOpacity=".5"/>
    <circle cx="22" cy="17" r="2.5" fill={color} fillOpacity=".5"/>
    <circle cx="29" cy="20" r="2.5" fill={color} fillOpacity=".5"/>

// ── ATOMS ─────────────────────────────────────────────────────
const Pill = ({ children, active, gold, style={} }) => (
  <div style={{
    borderRadius:9999, padding:'5px 13px',
    fontSize:12, fontWeight:500, fontFamily:sans, whiteSpace:'nowrap',
    background: active ? C.gold : gold ? C.goldDim : C.surface2,
    color:      active ? '#0c0a07' : gold ? C.gold : C.textMuted,
    border:`0.5px solid ${active ? C.gold : gold ? C.goldBorder : 'rgba(255,255,255,0.06)'}`,
    ...style,
  }}>{children}</div>
);

const Tag = ({ children, red, style={} }) => (
  <span style={{
    fontSize:10, fontWeight:600, fontFamily:sans,
    color: red ? C.red : C.gold,
    background: red ? C.redDim : C.goldDim,
    border:`0.5px solid ${red ? C.redBorder : C.goldBorder}`,
    borderRadius:9999, padding:'2px 8px', ...style,
  }}>{children}</span>
);

const Lbl = ({ children, style={} }) => (
  <div style={{ fontFamily:sans, fontSize:10, fontWeight:700, letterSpacing:'.1em', textTransform:'uppercase', color:C.textMuted, ...style }}>{children}</div>
);

const ColorCircles = ({ colors, size=46 }) => (
  <div style={{ display:'flex', alignItems:'center' }}>
    {colors.map((col, i) => (
      <div key={col+i} style={{
        width:size, height:size, borderRadius:9999, background:col,
        marginLeft: i>0 ? -Math.round(size*.26) : 0,
        border:'2px solid #0c0a07',
        boxShadow:'inset 0 0 0 .5px rgba(255,255,255,.18)',
        zIndex: colors.length - i, flexShrink:0,
      }} />
    ))}
  </div>
);

const FloatingNav = ({ active=0, accent }) => {
  const icons = [
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M3 10.5L12 3l9 7.5V21a1 1 0 01-1 1H4a1 1 0 01-1-1V10.5z" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/><path d="M9 22V14h6v8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M2 8V5a2 2 0 012-2h3M2 16v3a2 2 0 002 2h3M22 8V5a2 2 0 00-2-2h-3M22 16v3a2 2 0 01-2 2h-3" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/><circle cx="12" cy="12" r="3.5" stroke="currentColor" strokeWidth="1.8"/></svg>,
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="7" r="4" stroke="currentColor" strokeWidth="1.8"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  ];
  return (
    <div style={{
      position:'absolute', bottom:44, left:'50%', transform:'translateX(-50%)',
      background:'rgba(10,8,5,.92)', backdropFilter:'blur(28px)', WebkitBackdropFilter:'blur(28px)',
      border:`0.5px solid ${C.goldBorder}`,
      borderRadius:9999, padding:'7px 8px', display:'flex', gap:4, zIndex:100,
      boxShadow:`0 8px 36px rgba(0,0,0,.5), 0 0 0 .5px rgba(201,168,124,.12) inset`,
    }}>
      {icons.map((icon, i) => (
        <div key={i} style={{
          width:48, height:36, borderRadius:9999,
          background: i===active ? C.goldDim : 'transparent',
          border:`0.5px solid ${i===active ? C.goldBorder : 'transparent'}`,
          display:'flex', alignItems:'center', justifyContent:'center',

          boxShadow: i===active ? `0 0 12px rgba(201,168,124,.15)` : 'none',

const Screen = ({ children, bg=C.bg, pt=62, pb=34, style={} }) => (

    position:'relative', overflow:'hidden',
    fontFamily:sans, WebkitFontSmoothing:'antialiased',

// ─────────────────────────────────────────────────────────────
// HOME B — Editorial
// ─────────────────────────────────────────────────────────────

    {/* Hero */}

          {ab('body-a',         'Body Type · Necklines',      BodyA)}
        </DCSection>
        <DCSection id="wardrobe"     title="Wardrobe Colors"     subtitle="Clothing palette based on undertone">
          {ab('wardrobe-a',     'Neutrals · Accents · Metals',WardrobeA)}
        </DCSection>
        <DCSection id="accessories"  title="Accessories & Makeup" subtitle="Jewelry for face shape · Makeup by undertone">
          {ab('accessories-a',  'Jewelry · Makeup Palette',   AccessoriesA)}
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection title="Accent Color">
          <TweakColor id="accent" label="Palette" options={['#c9a87c','#c9878a','#7c9c8e']} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
